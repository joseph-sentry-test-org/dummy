name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  double-checked:
    name: Every added line must be double-checked
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require staged annotations on every added line
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No prior commit to diff against; skipping."
              exit 0
            fi
          fi

          DIFF="$(git diff --unified=0 "$BASE"...HEAD)"
          if [ -z "$DIFF" ]; then
            echo "No changes."
            exit 0
          fi

          # Collect added lines (exclude +++ file headers and empty additions).
          mapfile -t ADDED < <(printf '%s\n' "$DIFF" | grep -E '^\+[^+]' | sed 's/^+//' || true)

          if [ "${#ADDED[@]}" -eq 0 ]; then
            echo "No non-empty added lines."
            exit 0
          fi

          # Gate 1 must pass before gate 2 is even disclosed. A patch therefore
          # needs at least two rounds of fixes to go green.
          check_marker() {
            local marker="$1"
            local fail=0
            local line
            while IFS= read -r line; do
              if [[ "$line" =~ ^[[:space:]]*$ ]]; then
                continue
              fi
              if [[ "$line" != *"$marker"* ]]; then
                echo "FAIL: added line missing '$marker':"
                echo "  | $line"
                echo
                fail=1
              fi
            done < <(printf '%s\n' "${ADDED[@]}")
            return "$fail"
          }

          echo "Checking ${#ADDED[@]} added line(s)..."
          echo

          echo "── Gate 1: '# double-checked' ──"
          if ! check_marker '# double-checked'; then
            echo "────────────────────────────────────────"
            echo "Every new/changed line in the patch must include a '# double-checked' comment."
            echo "Re-read the diff, annotate each added line, then push again."
            exit 1
          fi
          echo "OK: gate 1 satisfied."
          echo

          echo "── Gate 2: '# triple-checked' ──"
          echo "Gate 1 passed, so gate 2 now applies: double-checking is not enough."
          echo "Every added line must ALSO carry a '# triple-checked' marker, e.g.:"
          echo "    foo = bar()  # double-checked # triple-checked"
          echo
          if ! check_marker '# triple-checked'; then
            echo "────────────────────────────────────────"
            echo "Every new/changed line must include BOTH '# double-checked' and '# triple-checked'."
            echo "Append the second marker to each added line, then push again."
            exit 1
          fi

          echo "OK: all added lines are double- and triple-checked."

