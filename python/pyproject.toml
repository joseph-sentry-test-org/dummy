[project]
name = "seer-test-sandbox"
version = "0.1.0"
description = "Test repo for triggering Seer features on a local Sentry dev instance"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "sentry-sdk",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
